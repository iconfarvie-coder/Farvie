<!DOCTYPE html>

<html>

<head>

  <title>Payment Test Simulator</title>

  <style>

    body{

      background:#111;

      color:#0f0;

      font-family:monospace;

      padding:20px;

    }

    .box{

      border:1px solid #0f0;

      padding:20px;

      max-width:500px;

    }

    input{

      width:100%;

      margin:10px 0;

      padding:10px;

      background:#000;

      color:#0f0;

      border:1px solid #0f0;

    }

    button{

      padding:10px 20px;

      background:#0f0;

      border:none;

      cursor:pointer;

      font-weight:bold;

    }

    #log{

      margin-top:20px;

      background:#000;

      padding:10px;

      height:200px;

      overflow:auto;

    }

  </style>

</head>

<body>

<div class="box">

<h2>Payment Sandbox Simulator</h2>

<input id="card" placeholder="Test Card Number">

<input id="amount" placeholder="Amount">

<button onclick="processPayment()">

Process Test Payment

</button>

<div id="log"></div>

</div>

<script>

const logBox = document.getElementById("log");

function log(text){

  logBox.innerHTML += text + "<br>";

}

function processPayment(){

  const card = document.getElementById("card").value;

  const amount = document.getElementById("amount").value;

  if(card.length < 12){

    log("Invalid test card");

    return;

  }

  log("Connecting to sandbox gateway...");

  

  setTimeout(() => {

    log("Authorizing test transaction...");

  }, 500);

  setTimeout(() => {

    log("Approved: $" + amount);

    log("Transaction ID: TEST-" + Math.floor(Math.random()*100000));

  }, 1200);

}

</script>

</body>

</html>
